server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression (Brotli requires a custom module/image)
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;
    gzip_vary on;

    # Security headers. NOTE: nginx does not inherit server-level add_header
    # directives into a location that declares its own add_header, so the
    # three locations below (index.html, globe.html, versioned assets) each
    # re-declare the complete set (D-06).
    # Keep all of the lists identical to this one whenever a header changes.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;
    # Geolocation stays enabled for the 2D map (consent-first); camera and
    # microphone are not used anywhere.
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self), interest-cohort=()" always;

    # CSP in Report-Only mode — allows Leaflet, Esri tiles, and CDN scripts.
    # Move to enforcement once violations are reviewed and dependencies are
    # optionally self-hosted for a stricter policy.
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline' https://unpkg.com https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://unpkg.com; img-src 'self' data: https://server.arcgisonline.com https://*.arcgisonline.com; connect-src 'self' https://server.arcgisonline.com https://*.arcgisonline.com; font-src 'self'; worker-src 'self' blob:; report-uri /csp-report" always;

    # index.html and globe.html: revalidate always (no caching of the entry
    # points). Re-declare the full security header set (see note above).
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self), interest-cohort=()" always;
        add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline' https://unpkg.com https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://unpkg.com; img-src 'self' data: https://server.arcgisonline.com https://*.arcgisonline.com; connect-src 'self' https://server.arcgisonline.com https://*.arcgisonline.com; font-src 'self'; worker-src 'self' blob:; report-uri /csp-report" always;
    }

    location = /globe.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self), interest-cohort=()" always;
        add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline' https://unpkg.com https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://unpkg.com; img-src 'self' data: https://server.arcgisonline.com https://*.arcgisonline.com; connect-src 'self' https://server.arcgisonline.com https://*.arcgisonline.com; font-src 'self'; worker-src 'self' blob:; report-uri /csp-report" always;
    }

    # Versioned assets: cache for 1 year. Immutable caching is only safe when
    # every URL is versioned — app.js, view.js, globe.js, globe-math.js,
    # globe-watchdog.js, globe.css and the globe textures are all referenced
    # with a ?v= query parameter that changes with the content, and the
    # vendored Three.js module (three.module.min.js, OrbitControls.js) is
    # referenced through the globe.html import map with the same ?v= stamp.
    # Bump the ?v= whenever any of these files changes.
    location ~* \.(js|css|svg|ico|png|jpg|jpeg|webp)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self), interest-cohort=()" always;
        add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline' https://unpkg.com https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://unpkg.com; img-src 'self' data: https://server.arcgisonline.com https://*.arcgisonline.com; connect-src 'self' https://server.arcgisonline.com https://*.arcgisonline.com; font-src 'self'; worker-src 'self' blob:; report-uri /csp-report" always;
    }

    # Fallback to index.html for any unmatched route
    location / {
        try_files $uri $uri/ /index.html;
    }
}
